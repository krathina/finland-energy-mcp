name: Release

# Publishes to PyPI when a version tag (v0.1.0, v0.2.0, ...) is pushed.
# Uses PyPI "trusted publishing": PyPI trusts this workflow via GitHub's OIDC identity,
# so no PyPI password or API token is stored anywhere.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi # must match the environment name configured on PyPI
    permissions:
      id-token: write # lets the job prove to PyPI which repo and workflow it is
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Check the tag matches the package version
        run: |
          version=$(uv version --short)
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml"; exit 1; }

      - name: Run the same checks as CI
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish
