# Nightly contract tests against the real price API and the real server over stdio.
# Catches a changed API format the morning after it happens. One request per run.
name: Live contract tests

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC every night (off the hour, when schedules are less busy)
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Install exact locked dependencies
        run: uv sync --locked

      - name: Live tests
        run: uv run pytest -m live
